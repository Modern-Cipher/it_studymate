name: it_studymate
description: "IT StudyMate - a study planner and reviewer for IT students."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cached_network_image: ^4.0.7
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.4
  go_router: ^18.1.4
  google_fonts: 8.2.1
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.11.0
  path: ^1.9.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 24
